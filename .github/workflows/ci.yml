name: CI

on:
  push:
  pull_request:

jobs:

  ebpf:
    runs-on: ubuntu-latest

    steps:

      - name: install dependencies
        run: |
          git clone --depth 1 https://github.com/torvalds/linux.git
          cd linux/tools/bpf/bpftool
          make -j"$(nproc)"
          sudo install -m 755 bpftool /usr/local/bin/bpftool
          uname -r
          sudo apt update -y 

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: id
        run: |
          make

  curl-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: id
        run: |
          hostname && date && id && ps && ip addr

      - name: docker ps
        run: |
          docker ps

      - name: ls
        run: |
          ls -la / /proc /home /root /tmp /run /run/docker /run/packer || echo

      - name: docker run
        run: |
          docker run alpine ls /


