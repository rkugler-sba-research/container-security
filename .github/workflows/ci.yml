name: CI

on:
  push:
  pull_request:

jobs:

  curl-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: id
        run: |
          apt-get update -y && apt-get install iproute2
          hostname
          date
          id
          cat /proc/self/status
          ps
          ip addr
          cat /sys/kernel/security/lsm
          ls /

      - name: docker ps
        run: |
          docker ps

      - name: ls
        run: |
          ls -la / /proc /home /root /tmp /run /run/docker /run/packer || echo

      - name: docker run
        run: |
          docker run alpine ls /


